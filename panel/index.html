<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Belle Lashes — Conversaciones</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: #f5f0eb;
    color: #3a2f2a;
  }
  header {
    background: #d98ca0;
    color: white;
    padding: 16px 20px;
    font-size: 1.3em;
    font-weight: 600;
  }
  #app {
    display: flex;
    height: calc(100vh - 60px);
  }
  #lista {
    width: 300px;
    background: white;
    border-right: 1px solid #eadfd6;
    overflow-y: auto;
  }
  .contacto {
    padding: 14px 16px;
    border-bottom: 1px solid #f0e8e0;
    cursor: pointer;
  }
  .contacto:hover, .contacto.activo {
    background: #fbeef2;
  }
  .contacto .nombre {
    font-weight: 600;
    font-size: 0.95em;
  }
  .contacto .telefono {
    font-size: 0.8em;
    color: #999;
  }
  .contacto .preview {
    font-size: 0.85em;
    color: #777;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  #conversacion {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #hilo {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .burbuja {
    max-width: 60%;
    padding: 10px 14px;
    border-radius: 14px;
    margin-bottom: 10px;
    white-space: pre-wrap;
    font-size: 0.95em;
    line-height: 1.4;
  }
  .entrante {
    background: white;
    border: 1px solid #eadfd6;
    margin-right: auto;
  }
  .saliente {
    background: #d98ca0;
    color: white;
    margin-left: auto;
  }
  .hora {
    font-size: 0.7em;
    opacity: 0.6;
    margin-top: 4px;
  }
  #responder {
    display: flex;
    padding: 14px;
    background: white;
    border-top: 1px solid #eadfd6;
  }
  #texto {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 20px;
    font-size: 0.95em;
  }
  #enviar {
    margin-left: 10px;
    padding: 10px 20px;
    background: #d98ca0;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
  }
  #enviar:disabled { opacity: 0.5; cursor: not-allowed; }
  #vacio {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #999;
  }
  #estado { font-size: 0.8em; margin-top: 6px; min-height: 16px; }
</style>
</head>
<body>
<header>🌸 Le Belle Lashes — Conversaciones</header>
<div id="app">
  <div id="lista"></div>
  <div id="conversacion">
    <div id="vacio">Selecciona una conversación</div>
  </div>
</div>

<script>
const WEBHOOK_MENSAJES = "https://q3uhvgat.rpcld.co/webhook/le-code-one-obtener-mensajes-lbl";
const WEBHOOK_RESPONDER = "https://q3uhvgat.rpcld.co/webhook/le-code-one-enviar-mensaje-asesor-lbl";

let authHeader = sessionStorage.getItem('lbl_panel_auth') || '';
if (!authHeader) {
  const user = prompt('Usuario del panel:') || '';
  const pass = prompt('Contraseña del panel:') || '';
  authHeader = 'Basic ' + btoa(user + ':' + pass);
  sessionStorage.setItem('lbl_panel_auth', authHeader);
}

let contactos = {};
let telefonoActivo = null;

async function cargar() {
  const res = await fetch(WEBHOOK_MENSAJES, {
    headers: { Authorization: authHeader }
  });
  if (!res.ok) {
    sessionStorage.removeItem('lbl_panel_auth');
    alert('Usuario o contraseña incorrectos. Recarga la página para intentar de nuevo.');
    return;
  }
  const rows = await res.json();
  contactos = {};
  for (const r of rows) {
    if (!contactos[r.telefono]) contactos[r.telefono] = { nombre: r.nombre_contacto || r.telefono, mensajes: [] };
    if (r.nombre_contacto) contactos[r.telefono].nombre = r.nombre_contacto;
    contactos[r.telefono].mensajes.push(r);
  }
  pintarLista();
  if (telefonoActivo) pintarHilo(telefonoActivo);
}

function pintarLista() {
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  const telefonos = Object.keys(contactos).sort((a, b) => {
    const ua = contactos[a].mensajes.at(-1).creado_en;
    const ub = contactos[b].mensajes.at(-1).creado_en;
    return ub.localeCompare(ua);
  });
  for (const tel of telefonos) {
    const c = contactos[tel];
    const ultimo = c.mensajes.at(-1);
    const div = document.createElement('div');
    div.className = 'contacto' + (tel === telefonoActivo ? ' activo' : '');
    div.innerHTML = `<div class="nombre">${c.nombre}</div><div class="telefono">${tel}</div><div class="preview">${ultimo.direccion === 'saliente' ? '↩ ' : ''}${escapeHtml(ultimo.mensaje || '')}</div>`;
    div.onclick = () => { telefonoActivo = tel; pintarLista(); pintarHilo(tel); };
    lista.appendChild(div);
  }
}

function pintarHilo(tel) {
  const cont = document.getElementById('conversacion');
  const c = contactos[tel];
  cont.innerHTML = `
    <div id="hilo"></div>
    <div>
      <div id="responder">
        <input id="texto" type="text" placeholder="Escribe una respuesta..." />
        <button id="enviar">Enviar</button>
      </div>
      <div id="estado" style="padding-left:14px;"></div>
    </div>
  `;
  const hilo = document.getElementById('hilo');
  for (const m of c.mensajes) {
    const b = document.createElement('div');
    b.className = 'burbuja ' + m.direccion;
    b.innerHTML = `${escapeHtml(m.mensaje || '')}<div class="hora">${new Date(m.creado_en).toLocaleString('es-CO', { timeZone: 'America/Bogota' })}</div>`;
    hilo.appendChild(b);
  }
  hilo.scrollTop = hilo.scrollHeight;

  const btn = document.getElementById('enviar');
  const input = document.getElementById('texto');
  const estado = document.getElementById('estado');
  btn.onclick = async () => {
    const texto = input.value.trim();
    if (!texto) return;
    btn.disabled = true;
    estado.textContent = 'Enviando...';
    try {
      const res = await fetch(WEBHOOK_RESPONDER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telefono: tel, mensaje: texto })
      });
      if (res.ok) {
        estado.textContent = 'Enviado ✓';
        input.value = '';
        setTimeout(cargar, 1500);
      } else {
        estado.textContent = 'Error al enviar';
      }
    } catch (e) {
      estado.textContent = 'Error de conexión';
    }
    btn.disabled = false;
  };
  input.onkeydown = (e) => { if (e.key === 'Enter') btn.click(); };
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

cargar();
setInterval(cargar, 15000);
</script>
</body>
</html>
